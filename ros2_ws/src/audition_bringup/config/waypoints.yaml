
waypoint_manager_node:

  ros__parameters:

    waypoints:

      labels: ["west_mid", "west_top", "north_mid", "north_right", "east_mid", "east_bottom", "south_mid", "south_left"]

      x: [0.0, 0.0, 1.0, 2.0, 2.0, 2.0, 1.0, 0.0]

      y: [2.0, 4.0, 4.0, 4.0, 2.0, 0.0, 0.0, 0.0]
      
      yaw: [
        0.0,       # west_mid (0,2) — RECORD, face east (toward center)
        0.0,       # west_top (0,4) — corner, face east for next leg
        -1.5708,   # north_mid (1,4) — RECORD, face south (toward center)
        -1.5708,   # north_right (2,4) — corner, face south for next leg
        3.1416,    # east_mid (2,2) — RECORD, face west (toward center)
        3.1416,    # east_bottom (2,0) — corner, face west for next leg
        1.5708,    # south_mid (1,0) — RECORD, face north (toward center)
        1.5708     # south_left (0,0) — corner, face north to loop back
      ]
