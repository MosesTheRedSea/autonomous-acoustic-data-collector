waypoint:
  ros__parameters:
    waypoints:

      labels: [
        "west_mid",
        "west_top",
        "north_mid",
        "north_right",
        "east_mid",
        "east_bottom",
        "south_mid",
        "south_left"
      ]

      x: [0.0, 0.0, 1.0, 2.0, 2.0, 2.0, 1.0, 0.0]

      y: [2.0, 4.0, 4.0, 4.0, 2.0, 0.0, 0.0, 0.0]

      yaw: [
        1.5708,   # west_mid -> continue +Y after ladder recording
        0.0,      # west_top -> turn right, move +X
        0.0,      # north_mid -> continue +X after speaker recording
        -1.5708,  # north_right -> turn down, move -Y
        -1.5708,  # east_mid -> continue -Y
        3.1416,   # east_bottom -> turn left, move -X
        3.1416,   # south_mid -> continue -X
        1.5708    # south_left -> turn up, reset loop
      ]


